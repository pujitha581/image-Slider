<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .slider {
            position: relative;
            max-width: 600px;
            overflow: hidden;
        }
        .slider img {
            width: 100%;
            display: none;
        }
        .slider img.active {
            display: block;
        }
        .buttons {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #dfb2b2;
        }
    </style>
</head>
<body>
    <div class="slider">
        <img src="http://i0.wp.com/thenewcamera.com/wp-content/uploads/2016/02/Sony-a6300-sample-images-5.jpg" class="active" alt="Image 1">
        <img src="https://photoshopcafe.com/wp-content/uploads/2019/02/oceanscape.jpg" alt="Image 2">
        <img src="https://photographylife.com/wp-content/uploads/2016/01/Sony-A6000-Sample-Images-9.jpg" alt="Image 3">
    </div>
    <div class="buttons">
        <button onclick="prevImage()">Previous</button>
        <button onclick="nextImage()">Next</button>
    </div>
    
    <script>
        let index = 0;
        const images = document.querySelectorAll('.slider img');

        function showImage(i) {
            images.forEach(img => img.classList.remove('active'));
            images[i].classList.add('active');
        }

        function nextImage() {
            index = (index + 1) % images.length;
            showImage(index);
        }

        function prevImage() {
            index = (index - 1 + images.length) % images.length;
            showImage(index);
        }
    </script>
</body>
</html>
